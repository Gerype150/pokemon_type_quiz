<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Type Quiz</title>
  <link rel="stylesheet" href="style.css">
  <style>
    button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .options button {
      display: block;
      margin: 5px auto;
    }
    #pokemon-image {
      display: block;
      margin: 0 auto 20px;
      max-width: 100px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Start Screen -->
    <div id="start-screen">
      <h1>¿Are you a Pokemon Master?</h1>
      <button id="start-btn">Start</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">
      <h1 id="question"></h1>
      <img id="pokemon-image" src="" alt="Pokemon">
      <div id="score-container">Score: <span id="current-score">0</span></div>
      <div class="options" id="options-container"></div>
      <button id="next-btn" class="hidden">Next</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden">
      <h1>Results</h1>
      <p id="score"></p>
      <button id="restart-btn">Try again</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
